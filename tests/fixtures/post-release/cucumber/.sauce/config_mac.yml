apiVersion: v1alpha
kind: playwright-cucumberjs
sauce:
  region: us-west-1
  concurrency: 10
  metadata:
    tags:
      - e2e
    build: "$BUILD_ID"
defaults:
  timeout: 5m
playwright:
  version: 1.57.0
rootDir: ./
suites:
  # macOS 13, not 12: Chrome for Testing 151 (playwright 1.62) requires macOS 13.0.
  - name: My Cucumber Test
    browserName: "chromium"
    platformName: "macOS 13"
    options:
      paths:
        - "features/**/*.feature"
      require:
        - "features/support/*.js"
      format:
        - "json:my-cucumber.json"

npm:
  dependencies:
    - "@cucumber/cucumber"
    - "@saucelabs/cucumber-reporter"
    - "ts-node"
    - "typescript"
    - "pretty-seconds"
