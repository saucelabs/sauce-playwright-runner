apiVersion: v1alpha
kind: playwright
sauce:
  region: us-west-1
  concurrency: 3
  metadata:
    tags:
      - e2e
rootDir: .
playwright:
  # CAUTION: This has to be an already deployed framework version in the cloud. Not necessarily the one you want to test.
  # Then use --runner-version to specify the release you actually want to use.
  version: 1.57.0
suites:
  # playwright-macos-arm64.zip targets mac26-arm64, which playwright also
  # resolves macOS 27 to.
  - name: "Post Release Test (macOS 26) - chromium"
    platformName: "macOS 26"
    armRequired: true
    testMatch: ['.*.js']
    params:
      browserName: "chromium"

  - name: "Post Release Test (macOS 26) - firefox"
    platformName: "macOS 26"
    armRequired: true
    testMatch: ['.*.js']
    params:
      browserName: "firefox"

  - name: "Post Release Test (macOS 26) - webkit"
    platformName: "macOS 26"
    armRequired: true
    testMatch: ['.*.js']
    params:
      browserName: "webkit"

npm:
  packages:
    pretty-seconds: '^3.0.0'
