apiVersion: v1alpha
kind: playwright
sauce:
  region: us-west-1
  concurrency: 3
  metadata:
    tags:
      - e2e
rootDir: .
playwright:
  # CAUTION: This has to be an already deployed framework version in the cloud. Not necessarily the one you want to test.
  # Then use --runner-version to specify the release you actually want to use.
  version: 1.57.0
suites:
  # macOS 13, not 12: Chrome for Testing 151 (playwright 1.62) requires macOS 13.0.
  - name: "Post Release Test (macOS) - chromium"
    platformName: "macOS 13"
    testMatch: ['.*.js']
    params:
      browserName: "chromium"

  - name: "Post Release Test (macOS) - firefox"
    platformName: "macOS 12"
    testMatch: ['.*.js']
    params:
      browserName: "firefox"

  - name: "Post Release Test (macOS 15) - chromium"
    platformName: "macOS 15"
    armRequired: true
    testMatch: ['.*.js']
    params:
      browserName: "chromium"

  - name: "Post Release Test (macOS 15) - firefox"
    platformName: "macOS 15"
    armRequired: true
    testMatch: ['.*.js']
    params:
      browserName: "firefox"

  - name: "Post Release Test (macOS 15) - webkit"
    platformName: "macOS 15"
    armRequired: true
    testMatch: ['.*.js']
    params:
      browserName: "webkit"

npm:
  packages:
    pretty-seconds: '^3.0.0'
